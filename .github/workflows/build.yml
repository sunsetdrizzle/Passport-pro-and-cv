name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install flet
          pip install -r Requirements.txt
      - name: Build APK
        run: flet build apk -v
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/
