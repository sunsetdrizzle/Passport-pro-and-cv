name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install flet
        run: pip install flet
      - name: Build APK
        run: flet pack Main.py --android
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/
